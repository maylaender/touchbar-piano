<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:transparent;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;width:1400px}
.wrap{padding:30px 50px 40px}
.screen{background:#111;border-radius:24px 24px 0 0;padding:16px 16px 0;margin:0 60px}
.display{height:640px;background:linear-gradient(135deg,#2c3e70,#6b5a9e 55%,#e0957a);border-radius:6px 6px 0 0;position:relative;overflow:hidden}
.win{position:absolute;left:50%;top:26px;transform:translateX(-50%);width:880px;border-radius:12px;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.hinge{height:16px;background:linear-gradient(#9da2aa,#c9cdd3);border-radius:0 0 6px 6px;margin:0 30px}
.deck{background:linear-gradient(#d3d7dd,#bfc4cb);border-radius:0 0 26px 26px;padding:24px 46px 34px;margin-top:-2px}
.tb{background:#000;border-radius:8px;padding:4px;display:flex}
.tb img{width:100%;height:40px;object-fit:fill;display:block}
.row{display:flex;gap:9px;margin-top:12px}
.k{flex:1;height:50px;border-radius:7px;background:#1c1c1e;box-shadow:0 2px 0 #000}
</style></head><body><div class="wrap">
<div class="screen"><div class="display"><img class="win" src="../docs/window-main.png"></div></div>
<div class="hinge"></div>
<div class="deck"><div class="tb"><img src="../docs/touchbar-main.png"></div><div class="row" id="r"></div></div>
</div><script>for(let i=0;i<14;i++){const k=document.createElement('div');k.className='k';document.getElementById('r').appendChild(k)}</script></body></html>
