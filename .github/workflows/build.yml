name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh
      - run: ditto -c -k --keepParent Piano.app Piano.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Piano.app
          path: Piano.app.zip
      - name: Release (if VERSION is new)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(cat VERSION)
          gh release view "$V" >/dev/null 2>&1 || gh release create "$V" Piano.app.zip --title "$V" --notes-file release-notes.md --target "$GITHUB_SHA"
