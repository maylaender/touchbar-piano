name: build
on:
  push:
    branches: [main, beta, v3, v3.1, v3.2-beta, v3.3, v3.4]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh
      - run: ditto -c -k --keepParent Piano.app Piano.app.zip
      - name: Self test (songs, MIDI round-trip)
        run: PIANO_SELFTEST=1 ./Piano.app/Contents/MacOS/Piano
      - name: Snapshot (run app, render real views)
        continue-on-error: true
        run: |
          PIANO_SNAPSHOT="$PWD/snapshot" ./Piano.app/Contents/MacOS/Piano & PID=$!
          for i in $(seq 1 240); do kill -0 $PID 2>/dev/null || break; sleep 1; done
          kill $PID 2>/dev/null || true
          ls snapshot | wc -l || true
          # on a crash: print the macOS crash report (crashed thread)
          R=$(ls -t ~/Library/Logs/DiagnosticReports/Piano* 2>/dev/null | head -1)
          if [ -n "$R" ]; then python3 -c "import json,sys; t=open(sys.argv[1]).read().split('\n',1)[1]; d=json.loads(t); th=[x for x in d['threads'] if x.get('triggered')][0]; ims=d['usedImages']; print(d.get('exception')); [print(f.get('symbol','?'), ims[f['imageIndex']].get('name','?')) for f in th['frames'][:25]]" "$R" || head -c 4000 "$R"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshot
          path: snapshot
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: Piano.app
          path: Piano.app.zip
      - name: Release (if VERSION is new)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(cat VERSION)
          PRE=""; if echo "$V" | grep -q beta; then PRE="--prerelease"; fi
          gh release view "$V" >/dev/null 2>&1 || gh release create "$V" Piano.app.zip --title "$V" --notes-file release-notes.md --target "$GITHUB_SHA" $PRE
