name: build
on:
  push:
    branches: [main, beta]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh
      - run: ditto -c -k --keepParent Piano.app Piano.app.zip
      - name: Snapshot (run app, render real views)
        continue-on-error: true
        run: |
          PIANO_SNAPSHOT="$PWD/snapshot" ./Piano.app/Contents/MacOS/Piano & sleep 15; kill $! 2>/dev/null || true
          ls -la snapshot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshot
          path: snapshot
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: Piano.app
          path: Piano.app.zip
      - name: Release (if VERSION is new)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(cat VERSION)
          PRE=""; if echo "$V" | grep -q beta; then PRE="--prerelease"; fi
          gh release view "$V" >/dev/null 2>&1 || gh release create "$V" Piano.app.zip --title "$V" --notes-file release-notes.md --target "$GITHUB_SHA" $PRE
