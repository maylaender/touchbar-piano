name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./build.sh
      - run: ditto -c -k --keepParent Piano.app Piano.app.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Piano.app
          path: Piano.app.zip
      - name: Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Piano.app.zip --title "$GITHUB_REF_NAME" --notes-file release-notes.md
